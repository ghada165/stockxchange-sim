spring:
  application:
    name: exchange-matching-engine

  # Java 21: chaque requete HTTP est traitee par un virtual thread
  # (leger, gere par la JVM) au lieu d'un thread systeme du pool Tomcat.
  # Ideal ici: une requete passe l'essentiel de son temps a attendre la base.
  threads:
    virtual:
      enabled: true

  # Par defaut: H2 en memoire pour pouvoir lancer le projet immediatement
  # sans installer PostgreSQL. Pour la soutenance / prod, active le profil
  # "postgres" (voir application-postgres.yml) avec -Dspring.profiles.active=postgres
  datasource:
    url: jdbc:h2:mem:exchange;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false     # pas de session JPA ouverte pendant le rendu de la reponse
    hibernate:
      ddl-auto: validate    # le schema est gere par Flyway, jamais par Hibernate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuration metier (record ExchangeProperties)
exchange:
  starting-balance: 100000     # cash offert a chaque nouveau compte trader ($)
  starting-shares: 100         # actions offertes par symbole a chaque nouveau compte
  seed-market: true            # le teneur de marche amorce les carnets vides au demarrage
  seed-demo-users: true        # cree alice, bob, carol (mot de passe: password123)

  # Symboles cotes au premier demarrage (ensuite geres par l'admin)
  symbols:
    - symbol: AAPL
      name: Apple Inc.
      reference-price: 230.00
    - symbol: TSLA
      name: Tesla Inc.
      reference-price: 250.00
    - symbol: MSFT
      name: Microsoft Corp.
      reference-price: 420.00
    - symbol: GOOGL
      name: Alphabet Inc.
      reference-price: 170.00

  # Heures d'ouverture initiales (ensuite modifiables par l'admin).
  # enforced: false -> marche toujours ouvert, pratique pour une demo le soir.
  market-hours:
    open: "09:00"
    close: "17:30"
    zone: Europe/Paris
    days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    enforced: false

  security:
    # Cle de signature des JWT (32 caracteres minimum). A surcharger en production:
    # variable d'environnement EXCHANGE_SECURITY_JWT_SECRET
    jwt-secret: ${EXCHANGE_SECURITY_JWT_SECRET:stockxchange-sim-dev-secret-change-me-0123456789}
    token-validity: 8h
    max-failed-logins: 5       # echecs consecutifs avant verrouillage temporaire du compte
    lock-duration: 15m
    admin-password: ${EXCHANGE_SECURITY_ADMIN_PASSWORD:admin123}

# Documentation Swagger: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true   # garde le jeton "Authorize" apres un rafraichissement

server:
  port: 8080

logging:
  level:
    com.exchange.matching: DEBUG
